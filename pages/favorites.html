<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Restaurants - Culinary Compass</title>
    <link rel="stylesheet" href="../assets/css/profile.css">
    <link rel="stylesheet" href="../assets/css/favorites.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">
            <a href="../index.html" class="brand-link">
                <h1>Culinary Compass</h1>
            </a>
        </div>

        <div class="nav-actions">
            <a href="../index.html" class="btn-outline">← Trang chủ</a>
            <button class="btn-outline active">♡ Địa điểm yêu thích</button>
            <button class="btn-outline" onclick="window.location.href='tour-history.html'">↺ Lịch sử tour</button>
            <button class="btn-outline" onclick="window.location.href='profile.html'">👤 Hồ sơ</button>
            <button class="btn-outline logout-btn" onclick="handleLogout()">↪ Đăng xuất</button>
        </div>
    </header>

    <main class="profile-container">
        <div class="page-title">
            <h2>♡ Địa Điểm Yêu Thích</h2>
            <p>Quản lý các nhà hàng và món ăn yêu thích của bạn</p>
        </div>

        <!-- Filter Section -->
        <div class="card filter-card">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="filter-type">Loại:</label>
                    <select id="filter-type" class="filter-select" onchange="filterFavorites()">
                        <option value="all">Tất cả</option>
                        <option value="restaurants">Nhà hàng</option>
                        <option value="dishes">Món ăn</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="sort-by">Sắp xếp:</label>
                    <select id="sort-by" class="filter-select" onchange="sortFavorites()">
                        <option value="recent">Mới nhất</option>
                        <option value="oldest">Cũ nhất</option>
                        <option value="name">Tên A-Z</option>
                        <option value="rating">Đánh giá cao</option>
                    </select>
                </div>

                <button class="btn-clear" onclick="clearAllFavorites()">Xóa tất cả</button>
            </div>
        </div>

        <!-- Favorites Grid -->
        <div id="favorites-container" class="favorites-grid">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="empty-icon">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
            <h3>Chưa có địa điểm yêu thích</h3>
            <p>Bắt đầu khám phá và thêm các nhà hàng yêu thích của bạn!</p>
            <button class="btn-primary" onclick="window.location.href='features/search.html'">Khám phá ngay</button>
        </div>
    </main>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/favorites.js"></script>
</body>
</html>
