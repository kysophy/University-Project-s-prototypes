<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - Culinary Compass</title>
    <link rel="stylesheet" href="../assets/css/profile.css">
    <link rel="stylesheet" href="../assets/css/favorites.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">
            <a href="../index.html" class="brand-link">
                <h1>Culinary Compass</h1>
            </a>
        </div>

        <div class="nav-actions">
            <button class="btn-outline" onclick="window.location.href='regions/hcmc.html'">← Home</button>
            <button class="btn-outline active">♡ Favorites</button>
            <button class="btn-outline" onclick="window.location.href='tour-history.html'">↺ Tour History</button>
            <button class="btn-outline" onclick="window.location.href='profile.html'">👤 Profile</button>
            <button class="btn-outline logout-btn" onclick="handleLogout()">↪ Sign Out</button>
        </div>
    </header>

    <main class="profile-container">
        <div class="page-title">
            <h2>♡ Favorites</h2>
            <p>Manage your favorite restaurants and dishes</p>
        </div>

        <!-- Filter Section -->
        <div class="card filter-card">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="filter-type">Type:</label>
                    <select id="filter-type" class="filter-select" onchange="filterFavorites()">
                        <option value="all">All</option>
                        <option value="restaurants">Restaurants</option>
                        <option value="dishes">Dishes</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="sort-by">Sort:</label>
                    <select id="sort-by" class="filter-select" onchange="sortFavorites()">
                        <option value="recent">Most Recent</option>
                        <option value="oldest">Oldest</option>
                        <option value="name">Name A-Z</option>
                        <option value="rating">Highest Rating</option>
                    </select>
                </div>

                <button class="btn-clear" onclick="clearAllFavorites()">Clear All</button>
            </div>
        </div>

        <!-- Favorites Grid -->
        <div id="favorites-container" class="favorites-grid">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="empty-icon">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
            <h3>No favorites yet</h3>
            <p>Start exploring and add your favorite restaurants!</p>
            <button class="btn-primary" onclick="window.location.href='features/search.html'">Explore Now</button>
        </div>
    </main>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/favorites.js"></script>
</body>
</html>
