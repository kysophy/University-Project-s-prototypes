<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Culinary Compass</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="overlay">
                <h1 class="brand-name">Culinary<br>Compass</h1>
                <p class="slogan">Khám phá hương vị Việt Nam đích thực<br>Discover Authentic Vietnamese Flavors</p>
            </div>
        </div>

        <div class="right-panel">
            <div class="auth-tabs">
                <a href="signin.html" class="tab">Đăng Nhập</a>
                <a href="signup.html" class="tab active">Đăng Ký</a>
            </div>

            <div class="form-wrapper">
                <h2>Tạo tài khoản</h2>
                <p class="sub-title">Bắt đầu hành trình khám phá ẩm thực Việt</p>

                <form id="signupForm">
                    <div class="input-group">
                        <label>Tên đăng nhập</label>
                        <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>

                    <div class="input-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                    </div>

                    <button type="submit" class="btn-submit">Đăng Ký</button>
                </form>

                <p class="footer-text">
                    Bằng cách đăng ký, bạn đồng ý với <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a>.
                </p>
            </div>
        </div>
    </div>
    
    <script src="../assets/js/signup.js"></script>
</body>
</html>
